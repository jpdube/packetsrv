[project]
name = "packetsrv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "click>=8.5.0",
    "flask>=3.1.3",
    "flask-bcrypt>=1.0.1",
    "flask-cors>=6.0.5",
    "flask-jwt-extended>=4.7.4",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

# [tool.maturin]
# features = ["pyo3/extension-module"]
# module-name = "crates/processor"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "crates/processor/Cargo.toml" },
    { file = "**/*.rs" },
]
